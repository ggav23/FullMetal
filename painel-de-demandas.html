<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Demandas</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/listagem.css" />
    <script src="js/header.js" defer></script>
    <script src="js/catalogos.js" defer></script>
    <script src="js/demandas.js" defer></script>
    <script src="js/visibilidade.js" defer></script>
    <script src="js/dados.js" defer></script>
    <script src="js/interface.js" defer></script>
    <script src="js/filtros.js" defer></script>
    <script src="js/listagem-demandas.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo principal</a>

    <header class="topbar">
      <nav class="brand-cluster" aria-label="Navegação principal">
        <a class="brand" href="painel-de-demandas.html" aria-current="page">
          <span class="brand-logo-container">
            <img
              src="assets/fullmetal-symbol.svg"
              width="26"
              height="26"
              alt=""
            />
          </span>
          <span class="brand-name">FULLMETAL</span>
        </a>
      </nav>

      <div class="topbar-actions">
        <button
          class="btn-contrast-toggle"
          type="button"
          data-contrast-toggle
          aria-pressed="false"
          aria-label="Ativar alto contraste"
          hidden
        >
          <span class="contrast-icon" aria-hidden="true">◐</span>
          <span class="contrast-label">Contraste</span>
        </button>

        <div class="profile-container">
          <p class="profile-indicator">
            <span class="profile-label">Perfil:</span>
            <strong class="profile-value" id="perfil-atual">A definir</strong>
          </p>
        </div>
      </div>
    </header>

    <main id="conteudo" class="container listagem-page" tabindex="-1">
      <h1>Minhas demandas</h1>
      <a class="btn btn-primary" href="cadastro.html" data-nova-demanda
        >Nova demanda</a
      >

      <!-- busca e filtros -->
      <search>
        <form action="#" method="GET">
          <fieldset>
            <legend>Buscar e Filtrar Demandas</legend>

            <!-- busca -->
            <div class="list-filter-field">
              <label for="termo-busca">Pesquisar:</label>
              <input
                class="form-control"
                type="search"
                id="termo-busca"
                name="q"
                placeholder="ID, título ou localização…"
              />
            </div>

            <!-- filtros -->
            <div class="list-filter-field">
              <label for="filtro-departamento">Área de atendimento:</label>
              <select
                class="form-control"
                id="filtro-departamento"
                name="unidade"
                aria-describedby="ajuda-filtros"
              >
                <option value="">Todas as áreas</option>
              </select>
            </div>

            <!-- status -->
            <div class="list-filter-field">
              <label for="Status">Status:</label>
              <select class="form-control" id="Status" name="status">
                <option value="">Todos os status</option>
                <option>Pendente</option>
                <option>Em atendimento</option>
                <option>Concluída</option>
                <option>Cancelada</option>
              </select>
            </div>

            <div class="list-filter-actions">
              <button
                class="btn btn-secondary"
                type="button"
                data-limpar-listagem
                disabled
              >
                Limpar filtros
              </button>
            </div>
            <p id="ajuda-filtros" class="field-helper list-filter-note">
              A área de atendimento é a unidade que recebe a demanda. Os filtros
              são aplicados automaticamente.
            </p>
          </fieldset>
        </form>
      </search>

      <!-- listagem -->
      <section aria-labelledby="titulo-listagem">
        <div class="list-results-header">
          <h2 id="titulo-listagem">Demandas registradas</h2>
          <div class="list-order-field">
            <label class="form-label" for="ordem-demandas">Ordenar por</label>
            <select class="form-control" id="ordem-demandas" disabled>
              <option value="recentes">Mais recentes primeiro</option>
              <option value="antigas">Mais antigas primeiro</option>
            </select>
          </div>
        </div>
        <p class="error-summary" data-erro-listagem role="alert" hidden></p>
        <p data-carregando-listagem role="status">Carregando demandas…</p>
        <ul id="lista-demandas"></ul>
        <p
          class="sr-only"
          data-anuncio-listagem
          role="status"
          aria-live="polite"
        ></p>
      </section>
    </main>
    <noscript
      ><p class="container">
        Ative o JavaScript para consultar e filtrar as demandas.
      </p></noscript
    >
  </body>
</html>
