<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Demandas</title>
    <link rel="stylesheet" href="css/global.css">
    <script src="js/header.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo principal</a>

    <header class="topbar">
        <nav class="brand-cluster" aria-label="Navegação principal">
            <a class="brand" href="painel-de-demandas.html" aria-current="page">
                <span class="brand-logo-container">
                    <img src="assets/fullmetal-symbol.svg" width="26" height="26" alt="">
                </span>
                <span class="brand-name">FULLMETAL</span>
                <span class="brand-tag">UnDF</span>
            </a>
        </nav>

        <div class="topbar-actions">
            <button class="btn-contrast-toggle" type="button" data-contrast-toggle aria-pressed="false" aria-label="Ativar alto contraste" hidden>
                <span class="contrast-icon" aria-hidden="true">◐</span>
                <span class="contrast-label">Contraste</span>
            </button>

            <div class="profile-container">
                <p class="profile-indicator">
                    <span class="profile-label">Perfil:</span>
                    <strong class="profile-value" id="perfil-atual">A definir</strong>
                </p>
            </div>
        </div>
    </header>

    <main id="conteudo" class="container" tabindex="-1">
        <h1>Gerenciamento de Demandas</h1>
        <a class="btn btn-primary" href="cadastro.html">Nova Demanda</a>

        <!-- busca e filtros -->
        <search>
            <form action="#" method="GET">
                <fieldset>
                    <legend>Buscar e Filtrar Demandas</legend>
                    
                    <!-- busca -->
                    <label for="termo-busca">Pesquisar:</label>
                    <input type="search" id="termo-busca" name="q" placeholder="Digite o título ou ID...">

                    <!-- filtros -->
                    <label for="filtro-departamento">Departamento:</label>
                    <select id="filtro-departamento" name="departamento">
                        <option value="">Todos</option>
                        <option value="ti">T.I.</option>
                        <option value="manutencao">Manutenção</option>
                        <option value="rh">Recursos Humanos</option>
                    </select>

                    <!-- status -->
                    <label for="Status">Status:</label>
                    <select id="Status" name="status">
                        <option value="">Todos</option>
                        <option value="pendente">Pendentes</option>
                        <option value="andamento">Em Andamento</option>
                        <option value="concluido">Concluído</option>
                    </select>

                    <button type="submit">Aplicar</button>
                </fieldset>
            </form>
        </search>

        <!-- listagem -->
        <section aria-labelledby="titulo-listagem">
            <h2 id="titulo-listagem">Demandas Encontradas</h2>
            <ul id="lista-demandas">
            </ul>
        </section>

    </main>

</body>
</html>
