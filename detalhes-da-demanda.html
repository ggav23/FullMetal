<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Detalhes da demanda | Fullmetal</title>

    <link rel="icon" href="assets/fullmetal-symbol.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/detalhes.css" />
    <link rel="stylesheet" href="css/acoes.css" />

    <script src="js/header.js" defer></script>
    <script src="js/catalogos.js" defer></script>
    <script src="js/demandas.js" defer></script>
    <script src="js/visibilidade.js" defer></script>
    <script src="js/dados.js" defer></script>
    <script src="js/interface.js" defer></script>
    <script src="js/acoes.js" defer></script>
    <script src="js/detalhes.js" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo principal</a>

    <header class="topbar">
      <nav class="brand-cluster" aria-label="Navegação principal">
        <a class="brand" href="painel-de-demandas.html">
          <span class="brand-logo-container">
            <img
              src="assets/fullmetal-symbol.svg"
              width="26"
              height="26"
              alt=""
            />
          </span>
          <span class="brand-name">FULLMETAL</span>
        </a>
      </nav>

      <div class="topbar-actions">
        <button
          class="btn-contrast-toggle"
          type="button"
          data-contrast-toggle
          aria-pressed="false"
          aria-label="Ativar alto contraste"
          hidden
        >
          <span class="contrast-icon" aria-hidden="true">◐</span>
          <span class="contrast-label">Contraste</span>
        </button>

        <div class="profile-container">
          <p class="profile-indicator">
            <span class="profile-label">Perfil:</span>
            <strong class="profile-value" id="perfil-atual">A definir</strong>
          </p>
        </div>
      </div>
    </header>

    <main id="conteudo" class="container details-page" tabindex="-1">
      <a
        class="btn btn-back-pill"
        data-voltar-painel
        href="painel-de-demandas.html"
        >← Voltar para o painel</a
      >
      <p class="error-summary" role="alert" data-erro-detalhes hidden></p>
      <p
        class="sr-only"
        role="status"
        aria-live="polite"
        data-anuncio-detalhes
      ></p>

      <article
        class="demand-details"
        aria-labelledby="titulo-demanda"
        data-detalhe
        hidden
      >
        <!-- Identificação da demanda -->
        <header class="demand-heading">
          <div class="demand-id-row">
            <span>Nº da demanda</span>

            <strong id="demanda-id"></strong>

            <button
              class="btn btn-secondary copy-button"
              type="button"
              id="copiar-id"
            >
              Copiar
            </button>
          </div>

          <p class="demand-status-row">
            <span>Status atual:</span>

            <strong id="demanda-status" class="status-badge status-pendente">
            </strong>
          </p>

          <h1 id="titulo-demanda"></h1>
        </header>

        <!-- Informações principais -->
        <section
          class="details-card info-card"
          aria-labelledby="titulo-informacoes"
        >
          <h2 id="titulo-informacoes">Informações gerais</h2>

          <dl class="info-grid">
            <div class="info-item">
              <dt>Categoria</dt>
              <dd id="demanda-categoria"></dd>
            </div>

            <div class="info-item">
              <dt>Localização</dt>
              <dd id="demanda-localizacao"></dd>
            </div>

            <div class="info-item">
              <dt>Solicitante</dt>
              <dd id="demanda-solicitante"></dd>
            </div>

            <div class="info-item">
              <dt>Unidade responsável</dt>
              <dd id="demanda-unidade"></dd>
            </div>
            <div class="info-item">
              <dt>Data de criação</dt>
              <dd id="demanda-criacao"></dd>
            </div>
            <div class="info-item">
              <dt>Prioridade</dt>
              <dd id="demanda-prioridade"></dd>
            </div>
          </dl>
        </section>

        <!-- Histórico -->
        <section
          class="details-card history-card"
          aria-labelledby="titulo-historico"
        >
          <h2 id="titulo-historico">Histórico de andamento</h2>

          <ol id="demanda-historico" class="history-list"></ol>
        </section>

        <!-- Descrição -->
        <section
          class="details-card description-card"
          aria-labelledby="titulo-descricao"
        >
          <h2 id="titulo-descricao">Descrição do problema</h2>

          <p id="demanda-descricao" class="description-text"></p>
        </section>

        <!-- Área de ações -->
        <section
          class="details-card actions-card"
          aria-labelledby="titulo-acoes"
        >
          <h2 id="titulo-acoes">Ações disponíveis</h2>

          <div class="triage-form">
            <div class="form-group" data-grupo-acao>
              <label class="form-label" for="unidade-destino">
                Unidade de destino
              </label>

              <select
                class="form-control"
                id="unidade-destino"
                name="unidade-destino"
                required
                disabled
              >
                <option value="" selected>Selecione a unidade</option>
              </select>
            </div>
            <div class="form-group" data-grupo-acao>
              <label class="form-label" for="prioridade">Prioridade</label>
              <select class="form-control" id="prioridade" disabled>
                <option value="">Não definida</option>
                <option value="normal">Normal</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
              </select>
            </div>

            <div class="action-group">
              <button
                class="btn btn-primary"
                type="button"
                data-acao="encaminhar"
                disabled
              >
                Encaminhar demanda
              </button>

              <button
                class="btn btn-secondary"
                type="button"
                data-acao="prioridade"
                disabled
              >
                Salvar prioridade
              </button>
              <button
                class="btn btn-primary"
                type="button"
                data-acao="iniciar"
                disabled
              >
                Iniciar atendimento
              </button>
              <button
                class="btn btn-success"
                type="button"
                data-acao="concluir"
                disabled
              >
                Concluir atendimento
              </button>
              <button
                class="btn btn-danger-outline"
                type="button"
                data-acao="cancelar"
                disabled
              >
                Cancelar
              </button>
            </div>
          </div>
        </section>
      </article>
    </main>
    <noscript
      ><p class="container">
        Ative o JavaScript para consultar os detalhes das demandas.
      </p></noscript
    >
  </body>
</html>
